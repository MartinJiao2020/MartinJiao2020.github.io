<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>文档</title>

<!-- 顶部工具栏 -->
<div class="top-bar">
  <button id="toggleSidebar">☰</button>
  <span>这就是一个系统</span>
</div>

<style>
/* 你的侧边栏、active、hover样式不变 */
.sidebar{width:200px;position:fixed;top:0;left:0;height:100%;background:#19e806;padding:10px;}
.main{margin-left:220px;padding:20px;}
.sidebar a{display:block;padding:6px;text-decoration:none;color:#333;}
.sidebar a:hover{background:#eef1f5;}
.sidebar a.active{background:red;color:#ffffff00;}

.top-bar{
  height:48px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 12px;
  border-bottom:1px solid #e30505;
}
#toggleSidebar{
  border:none;
  background:none;
  font-size:20px;
  cursor:pointer;
}
.sidebar{
  position:fixed;
  top:48px;
  left:0;
  width:220px;
  height:calc(100vh - 48px);
  background:#f5f5f5;
  transition: all 0.3s; /* 平滑收起动画 */
}
/* 侧边栏收起状态 */
.sidebar.collapsed{
  left:-220px;
}
.main{
  margin-left:220px;
  margin-top:48px;
  transition: all 0.3s;
}
.main.expand{
  margin-left:0px;
}
</style>
</head>
<body>
<div class="sidebar">
  <ul style="list-style:none;padding:0;">
    <!-- 注意：href改成 #，自定义data-page记录要加载的文件 -->
    <li><a href="#" data-page="km1.html">1.科目1</a></li>
    <li><a href="#" data-page="km2.html">2.科目2</a></li>
    <li><a href="#" data-page="km3.html">3.科目3</a></li>
  </ul>
</div>

<div class="main" id="contentBox">
  <!-- 这里用来放加载进来的内容，初始可以放欢迎文字 -->
  <p>请点击左侧菜单</p>
</div>

<script>
const allMenuLinks = document.querySelectorAll('.sidebar a');
const contentBox = document.getElementById('contentBox');
const toggleBtn = document.getElementById('toggleSidebar');
const sidebar = document.querySelector('.sidebar');
const mainBox = document.querySelector('.main');

toggleBtn.onclick = function(){
  sidebar.classList.toggle('collapsed');
  mainBox.classList.toggle('expand');
}
allMenuLinks.forEach(link => {
  link.onclick = function(e){
    e.preventDefault(); // 阻止a标签默认跳转行为

    // 1. 移动小红贴纸 active
    allMenuLinks.forEach(item => item.classList.remove('active'));
    this.classList.add('active');

    // 2. 获取要加载的文件名
    const pageFile = this.dataset.page;

    // 3. 加载外部html，放到右侧contentBox
    fetch(pageFile)
      .then(res => res.text())
      .then(html => {
        contentBox.innerHTML = html;
      })
  }
})
</script>
</body>
</html>
